backend:
  - changed-files:
      - any-glob-to-any-file: ["src/**", "scripts/**"]
frontend:
  - changed-files:
      - any-glob-to-any-file: ["frontend/**"]
tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**"]
docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "*.md"]
ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**", ".pre-commit-config.yaml", "ruff.toml"]
